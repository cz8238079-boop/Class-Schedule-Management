    .content{max-width:1490px;margin:auto;padding:33px 40px 54px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:2px;color:#8ba49a;font-weight:700;margin-bottom:10px}.page-head h1{font-size:29px;letter-spacing:-.8px;margin:0;font-weight:770}.page-head p{color:#88999b;margin:10px 0 0;font-size:13px}.btn{border:0;border-radius:10px;padding:12px 17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:650;transition:.16s;white-space:nowrap}.btn:hover{transform:translateY(-1px)}.btn-primary{background:#147b68;color:white;box-shadow:0 5px 13px rgba(15,120,100,.14)}.btn-primary:hover{background:#0f6557}.btn-subtle{background:#edf4f0;color:#245b50}.btn-white{background:white;color:#244c47;box-shadow:0 5px 16px rgba(21,52,42,.06)}.btn-outline{background:white;color:#486265;border:1px solid #dde8e3}.btn-danger{background:#fff0ec;color:#b75845}.btn-sm{padding:8px 11px;font-size:12px;border-radius:8px}.btn .ico{width:16px;height:16px}

    .dashboard-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(270px,1fr);gap:20px}.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 24px 14px}.panel-title{font-size:16px;font-weight:760;letter-spacing:-.2px}.panel-sub{color:#98a6a6;font-size:11px;margin-top:6px}.panel-body{padding:0 24px 22px}.link-btn{background:none;border:0;color:#2d8d74;font-size:12px;font-weight:660;padding:5px}.session-item{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid #f0f3f1}.session-item:last-child{border-bottom:0}.time-block{width:62px;flex-shrink:0;color:#2e5e55;font-size:15px;font-weight:720}.time-block span{display:block;font-size:10px;color:#a3b0ae;font-weight:450;margin-top:5px}.session-info{flex:1;min-width:0}.session-title{font-size:13px;font-weight:690;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-meta{font-size:11px;color:#9aaaab;margin-top:7px}.tag{padding:5px 9px;font-size:10px;white-space:nowrap;border-radius:6px;background:#edf7ef;color:#40886a;font-weight:680;display:inline-block}.tag.warn{background:#fff2e5;color:#be8856}.tag.done{background:#edf2f8;color:#677f9b}.tag.off{background:#f2f3f3;color:#9ba5a6}.empty{padding:34px 18px;color:#91a1a4;text-align:center;line-height:1.8}
    .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:8px}.quick{border:1px solid #e8efec;border-radius:12px;padding:16px 12px;background:#fcfefd;text-align:left;color:#31584e;display:flex;flex-direction:column;gap:12px;font-weight:670;font-size:12px}.quick:hover{border-color:#a9d6bd;background:#f2faf4}.quick .ico{width:21px;height:21px;color:#39916f}.alert-list{padding:0 24px 23px}.alert-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #f0f2f1}.avatar{width:37px;height:37px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;font-weight:750;font-size:13px}.avatar.lg{width:42px;height:42px}.alert-row .name{font-size:12px;font-weight:670}.alert-row .desc{color:#9aa8aa;font-size:11px;margin-top:4px}.alert-row .right{margin-left:auto;color:#c27f54;font-weight:750;font-size:12px}
    .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 17px}.search{height:43px;display:flex;align-items:center;gap:10px;background:white;border:1px solid #e2eae7;border-radius:10px;color:#9eaeaa;padding:0 13px;min-width:255px;flex:1;max-width:390px}.search input{border:0;background:transparent;outline:0;width:100%;font-size:13px;color:var(--ink)}.search input::placeholder{color:#a4b2b1}.select{padding:11px 13px;border:1px solid #e3eae8;background:white;border-radius:10px;color:#4d6867;min-height:43px}.table-wrap{overflow:auto}.data-table{border-collapse:collapse;width:100%;min-width:690px}.data-table thead th{text-align:left;padding:14px 22px;background:#fafcfb;border-bottom:1px solid #edf1f0;color:#91a1a3;font-size:11px;font-weight:650}.data-table tbody td{padding:15px 22px;border-bottom:1px solid #f0f3f2;vertical-align:middle;font-size:12px}.data-table tbody tr:last-child td{border:0}.name-cell{display:flex;align-items:center;gap:10px;font-weight:720;color:#344e50}.muted{color:#9aa8a9}.pill{display:inline-flex;align-items:center;gap:5px;background:#eff8f2;color:#368b69;border-radius:20px;font-size:11px;padding:5px 10px;font-weight:650}.pill.low{background:#fff2e8;color:#bd7e4b}.actions{display:flex;gap:6px;flex-wrap:wrap}.textbtn{border:0;background:transparent;color:#247e6b;font-size:12px;padding:6px;font-weight:650}.textbtn:hover{text-decoration:underline}.textbtn.danger{color:#b76656}.filters{display:flex;gap:5px;background:#eef2f0;padding:4px;border-radius:10px}.filter-btn{border:0;background:transparent;color:#849997;border-radius:7px;padding:7px 12px;font-size:12px}.filter-btn.active{background:white;color:#246e5d;box-shadow:0 2px 8px rgba(13,40,35,.07);font-weight:750}
    .ledger-num{font-weight:760}.ledger-num.minus{color:#be8069}.ledger-num.plus{color:#268e6a}.info-note{padding:16px 19px;border:1px solid #dcece4;background:#f4faf5;border-radius:12px;color:#537467;font-size:12px;line-height:1.85;margin-bottom:20px}.settings-list{display:grid;gap:14px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;border-bottom:1px solid #eff3f1}.setting-row:last-child{border:0}.setting-row strong{font-size:13px}.setting-row p{color:#97a5a6;margin:7px 0 0;font-size:12px;line-height:1.7}
    .overlay{position:fixed;inset:0;background:rgba(11,29,33,.52);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{background:white;border-radius:18px;width:100%;max-width:480px;max-height:min(92vh,780px);overflow:auto;box-shadow:0 26px 85px rgba(8,30,34,.25)}.dialog-head{padding:24px 27px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dialog-head h3{font-size:19px;margin:0}.dialog-content{padding:23px 27px}.form-group{margin-bottom:18px}.form-group label{display:block;margin-bottom:8px;font-size:12px;font-weight:700;color:#556d6a}.form-group input,.form-group select,.form-group textarea{display:block;width:100%;border:1px solid #dce7e2;background:#fbfcfc;border-radius:10px;padding:12px 13px;outline:0;color:#29464a}.form-group textarea{min-height:74px;resize:vertical}.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#57b291;background:white}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.dialog-actions{padding-top:5px;display:flex;justify-content:flex-end;gap:10px}.hint{font-size:11px;color:#96a6a3;line-height:1.7;margin-top:6px}.foot-note{font-size:11px;color:#a8b5b2;margin-top:24px;text-align:center}.mask{display:none}
    @media(max-width:1120px){.sidebar{width:222px;min-width:222px}.content{padding:28px 24px}.topbar{padding:0 24px}.grid-stats{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:850px){.sidebar{position:fixed;transform:translateX(-100%);transition:transform .22s;width:248px}.sidebar.open{transform:translateX(0)}.mask.show{display:block;position:fixed;inset:0;background:#0c232977;z-index:19}.mobile-menu{display:grid}.main{width:100%}.topbar{height:68px}.dashboard-grid{grid-template-columns:1fr}.hero-art{min-width:170px}}
    @media(max-width:610px){.content{padding:23px 15px 40px}.topbar{padding:0 15px}.top-date{display:none}.page-head{align-items:flex-start}.page-head h1{font-size:25px}.page-head .btn{padding:10px 12px}.hero{padding:25px 23px;min-height:174px}.hero h2{font-size:23px}.hero-art{display:none}.grid-stats{gap:10px}.stat{padding:15px}.stat-value{font-size:27px}.stat-foot{font-size:10px}.panel-head{padding:18px 17px 12px}.panel-body{padding:0 17px 18px}.alert-list{padding:0 17px 18px}.form-grid{grid-template-columns:1fr}.setting-row{align-items:flex-start;flex-direction:column;padding:18px}.search{max-width:none;min-width:0}.modal{align-items:flex-end}.dialog{border-radius:18px 18px 10px 10px}.dialog-head,.dialog-content{padding-left:20px;padding-right:20px}}
  </style>

<body>
<div id="app"></div>
<script>
/* 课时管家 · 单文件演示版。所有数据仅保存在当前浏览器 localStorage。 */
const STORAGE_KEY = 'keshiguanjia-demo-v1';
const iconPaths = {
 home:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 layers:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 8h10M7 12h10M7 16h6"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V20h-2.6v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H6v-2.6h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1L9.1 6l.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V4h2.6v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1h.2v2.6h-.2a1.7 1.7 0 0 0-1.5 1z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 chevron:'<path d="m9 18 6-6-6-6"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
 bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 check:'<path d="m5 12 4 4L19 6"/>',
 arrow:'<path d="M5 12h14m-7-7 7 7-7 7"/>',
 spark:'<path d="m3 17 6-6 4 4 8-9"/><path d="M16 6h5v5"/>',
 wallet:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M16 14h5M3 9h18"/>',
 book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14ZM4 19.5A2.5 2.5 0 0 0 6.5 22H20"/>',
 download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',
 refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 12-2L20 12M4 12l2.5 5a7 7 0 0 0 12-2"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
 graduation:'<path d="m2 10 10-5 10 5-10 5-10-5ZM6 12v5c4 3 8 3 12 0v-5M22 10v6"/>'
};
function ico(name,size=18){return `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[name]||iconPaths.info}</svg>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localISO(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function shiftDays(n){const d=new Date();d.setDate(d.getDate()+n);return localISO(d)}
function dateText(s){if(!s)return '—';const [y,m,d]=s.split('-').map(Number);return `${m}月${d}日`}
function fullDate(s){if(!s)return '—';const [y,m,d]=s.split('-').map(Number);return `${y}年${m}月${d}日`}
function weekday(s){const [y,m,d]=s.split('-').map(Number);return ['周日','周一','周二','周三','周四','周五','周六'][new Date(y,m-1,d).getDay()]}
function seed(){return {
 students:[
 {id:'s1',name:'陈同学',subject:'钢琴',teacher:'林老师',remaining:3,total:20,phone:'',joined:shiftDays(-65),color:0},
 {id:'s2',name:'Bennett',subject:'美术',teacher:'周老师',remaining:12,total:24,phone:'',joined:shiftDays(-43),color:1},
 {id:'s3',name:'Claire',subject:'舞蹈',teacher:'许老师',remaining:8,total:16,phone:'',joined:shiftDays(-32),color:2},
 {id:'s4',name:'Mr Zhao',subject:'书法',teacher:'王老师',remaining:2,total:12,phone:'',joined:shiftDays(-21),color:3},
 {id:'s5',name:'David',subject:'钢琴',teacher:'林老师',remaining:16,total:20,phone:'',joined:shiftDays(-9),color:4}
 ],
 sessions:[
 {id:'c1',studentId:'s1',date:shiftDays(0),time:'09:30',status:'planned',note:''},
 {id:'c2',studentId:'s2',date:shiftDays(0),time:'11:00',status:'planned',note:''},
 {id:'c3',studentId:'s3',date:shiftDays(0),time:'14:30',status:'planned',note:''},
 {id:'c4',studentId:'s4',date:shiftDays(1),time:'10:00',status:'planned',note:''},
 {id:'c5',studentId:'s5',date:shiftDays(2),time:'16:00',status:'planned',note:''},
 {id:'c6',studentId:'s1',date:shiftDays(-1),time:'15:30',status:'done',note:'演示历史课程'}
 ],
 ledger:[{id:'l1',studentId:'s1',studentName:'陈同学',kind:'used',amount:1,date:shiftDays(-1),note:'已完成钢琴课程'}]
}}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const v=JSON.parse(raw);if(Array.isArray(v.students)&&Array.isArray(v.sessions)&&Array.isArray(v.ledger))return v}}catch(e){console.warn('本地数据读取失败，将使用演示数据',e)}return seed()}
let data=load(), view='dashboard', modal='', modalId='', menuOpen=false, studentQuery='', subjectFilter='全部', sessionFilter='planned';
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){alert('浏览器存储空间不足或不允许保存。当前修改可能在刷新后丢失。')}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function student(id){return data.students.find(s=>s.id===id)}
function initial(name){return String(name||'?').trim().slice(0,1).toUpperCase()}
const palette=[['#e4f1e9','#438b74'],['#e8eafa','#6b78bc'],['#fbece5','#bb8061'],['#ece9f7','#8e76b2'],['#e7f1f5','#5289ac']];
function avatar(s){const c=palette[(s?.color||0)%palette.length];return `<div class="avatar" style="background:${c[0]};color:${c[1]}">${esc(initial(s?.name))}</div>`}
function getUpcoming(){return [...data.sessions].filter(s=>s.status==='planned').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function getAlerts(){return data.students.filter(s=>s.remaining<=3).sort((a,b)=>a.remaining-b.remaining)}
function thisMonthDone(){return data.sessions.filter(s=>s.status==='done' && (s.completedAt||s.date).slice(0,7)===localISO().slice(0,7)).length}
function navItem(label,key,icon){return `<button type="button" class="nav-btn ${view===key?'active':''}" data-action="nav" data-view="${key}">${ico(icon)}<span>${label}</span>${key==='students'?`<small>${data.students.length}</small>`:''}</button>`}
function shell(){const labels={dashboard:'工作台',students:'学员管理',schedule:'课程安排',ledger:'课时流水',settings:'设置'};return `<div class="app"><div class="mask ${menuOpen?'show':''}" data-action="menu-close"></div>
 <aside class="sidebar ${menuOpen?'open':''}"><div class="brand"><div class="brand-logo">${ico('graduation',25)}</div><div><div class="brand-name">课时管家</div><div class="brand-desc">CLASSFLOW STUDIO</div></div></div>
 <div class="nav-label">工作空间 / WORKSPACE</div>${navItem('工作台','dashboard','home')}${navItem('学员管理','students','users')}${navItem('课程安排','schedule','calendar')}${navItem('课时流水','ledger','layers')}
 <div class="nav-label">系统 / SYSTEM</div>${navItem('设置与备份','settings','settings')}
 <div class="sidebar-spacer"></div><div class="sidebar-tip"><div class="tip-title">${ico('info',14)} 本地体验版本</div><p>数据仅储存在当前浏览器。可以放心用虚构资料体验功能；不要输入真实学员隐私数据。</p></div><div class="sidebar-footer">© 2026 Classflow · Demo v1.0</div></aside>
 <div class="main"><header class="topbar"><div class="crumb"><button class="round-btn mobile-menu" data-action="menu-open" aria-label="打开菜单">${ico('menu')}</button><span>工作空间</span>${ico('chevron',13)}<strong>${labels[view]}</strong></div><div class="top-actions"><span class="top-date">${fullDate(localISO())} · ${weekday(localISO())}</span><button class="round-btn" data-action="nav" data-view="settings" aria-label="数据与设置">${ico('bell',17)}</button><div class="profile" title="本地演示">DE</div></div></header>
 <main class="content">${page()}<div class="foot-note">课时管家 · 纯前端演示版 · 请勿用于存储真实学生个人信息</div></main></div></div>${modal?dialog():''}`}
function head(title,sub,btn){return `<div class="page-head"><div><div class="eyebrow">CLASSFLOW / MANAGEMENT</div><h1>${title}</h1><p>${sub}</p></div>${btn||''}</div>`}
function page(){if(view==='students')return studentsPage();if(view==='schedule')return schedulePage();if(view==='ledger')return ledgerPage();if(view==='settings')return settingsPage();return dashboardPage()}
function dashboardPage(){const upcoming=getUpcoming(),alerts=getAlerts(),sum=data.students.reduce((a,s)=>a+Number(s.remaining),0);const hour=new Date().getHours(),greeting=hour<11?'早上好':hour<18?'下午好':'晚上好';return `${head(greeting+'，欢迎回来 👋','让每节课都安排得井井有条。',`<button class="btn btn-primary" data-action="modal" data-modal="session">${ico('plus')} 添加课程</button>`)}
 <section class="hero"><div class="hero-left"><span class="hero-tag">✦ 你的教务日常，更轻松一点</span><h2>每节课，都清清楚楚。</h2><p>排课、消课、学生管理，一个工作台就够了。</p></div><div class="hero-art"><div class="floating-card first"><div class="float-label">活跃学员</div><div class="float-num">${data.students.length} <span style="font-size:12px">人</span></div></div><div class="floating-card second"><div class="float-row">${ico('check',14)} 数据井井有条</div><div class="float-label" style="margin-top:10px">让管理回归简单</div></div></div></section>
 <section class="grid-stats">${stat('在读学员',data.students.length,'当前演示机构','users')}${stat('待上课程',upcoming.length,'已安排、尚未完成','calendar')}${stat('剩余总课时',sum,'所有学员的余额','clock')}${stat('低课时提醒',alerts.length,'剩余 3 节及以下','bell',true)}</section>
 <div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">近期课程安排</div><div class="panel-sub">一眼掌握接下来的课程</div></div><button class="link-btn" data-action="nav" data-view="schedule">查看全部 →</button></div><div class="panel-body">${upcoming.length?upcoming.slice(0,5).map(scheduleItem).join(''):'<div class="empty">还没有待上的课程，添加一节吧！</div>'}</div></section>
 <div style="display:grid;gap:20px;align-content:start"><section class="panel"><div class="panel-head"><div><div class="panel-title">快捷操作</div><div class="panel-sub">常用功能，一键完成</div></div></div><div class="panel-body"><div class="quick-grid"><button class="quick" data-action="modal" data-modal="student">${ico('users')} 新增学员</button><button class="quick" data-action="modal" data-modal="session">${ico('calendar')} 安排课程</button><button class="quick" data-action="nav" data-view="students">${ico('clock')} 课时管理</button><button class="quick" data-action="nav" data-view="ledger">${ico('layers')} 查看流水</button></div></div></section>
 <section class="panel"><div class="panel-head"><div><div class="panel-title">课时不足提醒</div><div class="panel-sub">剩余 3 节及以下的学员</div></div><span class="tag warn">${alerts.length} 位</span></div><div class="alert-list">${alerts.length?alerts.slice(0,4).map(s=>`<div class="alert-row">${avatar(s)}<div><div class="name">${esc(s.name)}</div><div class="desc">${esc(s.subject)} · ${esc(s.teacher)}</div></div><div class="right">${s.remaining} 节</div></div>`).join(''):'<div class="empty">暂无低课时学员 ✨</div>'}</div></section></div></div>`}
function stat(label,n,note,icon,warn=false){return `<div class="stat"><div class="stat-top"><span class="stat-label">${label}</span><span class="stat-icon ${warn?'warn':''}">${ico(icon,19)}</span></div><div class="stat-value">${n}</div><div class="stat-foot">${note}</div></div>`}
function scheduleItem(c){const s=student(c.studentId);return `<div class="session-item"><div class="time-block">${esc(c.time)}<span>${dateText(c.date)} · ${weekday(c.date)}</span></div><div class="session-info"><div class="session-title">${esc(s?.name||'已删除学员')} · ${esc(s?.subject||'课程')}</div><div class="session-meta">授课老师：${esc(s?.teacher||'未设置')}${c.note?' · '+esc(c.note):''}</div></div><span class="tag">待上课</span></div>`}
function studentsPage(){const subs=['全部',...new Set(data.students.map(s=>s.subject))],rows=data.students.filter(s=>(subjectFilter==='全部'||s.subject===subjectFilter)&&[s.name,s.subject,s.teacher].join(' ').toLowerCase().includes(studentQuery.toLowerCase())).map(s=>`<tr><td><div class="name-cell">${avatar(s)}<div>${esc(s.name)}<div class="muted" style="font-size:10px;margin-top:5px">编号 ${esc(s.id.slice(-5).toUpperCase())}</div></div></div></td><td>${esc(s.subject)}</td><td>${esc(s.teacher)}</td><td><span class="pill ${s.remaining<=3?'low':''}">${s.remaining} 节</span></td><td class="muted">${dateText(s.joined)}</td><td><div class="actions"><button class="textbtn" data-action="use" data-id="${esc(s.id)}">消课</button><button class="textbtn" data-action="modal" data-modal="recharge" data-id="${esc(s.id)}">加课时</button><button class="textbtn" data-action="modal" data-modal="edit" data-id="${esc(s.id)}">编辑</button></div></td></tr>`).join('');return `${head('学员管理',`当前共 ${data.students.length} 位学员，统一管理基础信息与剩余课时。`,`<button class="btn btn-primary" data-action="modal" data-modal="student">${ico('plus')} 新增学员</button>`)}
 <div class="toolbar"><div class="search">${ico('search',16)}<input id="studentSearch" placeholder="搜索学员、课程或老师..." value="${esc(studentQuery)}" autocomplete="off" aria-label="搜索学员" /></div><select id="subjectFilter" class="select" aria-label="筛选课程">${subs.map(sub=>`<option value="${esc(sub)}" ${sub===subjectFilter?'selected':''}>${esc(sub==='全部'?'全部课程':sub)}</option>`).join('')}</select></div>
 <div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>学员姓名</th><th>课程类别</th><th>负责老师</th><th>剩余课时</th><th>加入时间</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan="6"><div class="empty">没有找到符合条件的学员</div></td></tr>'}</tbody></table></div></div><div class="info-note" style="margin-top:18px">${ico('info',15)} “消课”会直接扣除 1 节课并记录流水；“加课时”会增加余额。演示数据只保存在当前浏览器。</div>`}
function schedulePage(){const sessions=[...data.sessions].filter(c=>sessionFilter==='all'||(sessionFilter==='planned'?c.status==='planned':c.status===sessionFilter)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));return `${head('课程安排','把时间安排好，教学就更从容。',`<button class="btn btn-primary" data-action="modal" data-modal="session">${ico('plus')} 安排新课程</button>`)}
 <div class="toolbar"><div class="filters">${[['planned','待上课'],['done','已完成'],['cancelled','已取消'],['all','全部']].map(([k,label])=>`<button class="filter-btn ${sessionFilter===k?'active':''}" data-action="session-filter" data-filter="${k}">${label}</button>`).join('')}</div></div>
 <div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>日期 / 时间</th><th>学员</th><th>课程</th><th>授课老师</th><th>状态</th><th>操作</th></tr></thead><tbody>${sessions.length?sessions.map(c=>{const s=student(c.studentId);return `<tr><td><strong>${dateText(c.date)}</strong><div class="muted" style="font-size:11px;margin-top:5px">${weekday(c.date)} ${esc(c.time)}</div></td><td>${esc(s?.name||'已删除学员')}</td><td>${esc(s?.subject||'—')}</td><td class="muted">${esc(s?.teacher||'—')}</td><td><span class="tag ${c.status==='done'?'done':c.status==='cancelled'?'off':''}">${c.status==='done'?'已完成':c.status==='cancelled'?'已取消':'待上课'}</span></td><td><div class="actions">${c.status==='planned'?`<button class="textbtn" data-action="complete" data-id="${esc(c.id)}">完成消课</button><button class="textbtn danger" data-action="cancel" data-id="${esc(c.id)}">取消</button>`:'<span class="muted">—</span>'}</div></td></tr>`}).join(''):'<tr><td colspan="6"><div class="empty">当前筛选没有课程记录</div></td></tr>'}</tbody></table></div></div>`}
function ledgerPage(){const logs=[...data.ledger].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));return `${head('课时流水','每次加课、消课都有记录，方便核对。',`<button class="btn btn-outline" data-action="export">${ico('download')} 导出备份</button>`)}
 <div class="info-note">${ico('info',15)} 这里记录的是课时增减，不是学费或真实交易流水。第一版还没有在线支付功能。</div><div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>日期</th><th>学员</th><th>类型</th><th>变动课时</th><th>说明</th></tr></thead><tbody>${logs.length?logs.map(l=>`<tr><td>${dateText(l.date)}</td><td><strong>${esc(l.studentName||student(l.studentId)?.name||'—')}</strong></td><td><span class="tag ${l.kind==='used'?'done':''}">${l.kind==='used'?'完成消课':'增加课时'}</span></td><td class="ledger-num ${l.kind==='used'?'minus':'plus'}">${l.kind==='used'?'-':'+'}${l.amount}</td><td class="muted">${esc(l.note||'—')}</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">暂无课时流水</div></td></tr>'}</tbody></table></div></div>`}
function settingsPage(){return `${head('设置与备份','管理本地演示数据，不用联网也能运行。','')}<div class="panel settings-list"><div class="setting-row"><div><strong>导出全部数据</strong><p>下载 JSON 备份文件，包含本地演示的学员、课程和课时记录。</p></div><button class="btn btn-outline" data-action="export">${ico('download')} 导出 JSON</button></div><div class="setting-row"><div><strong>恢复初始演示数据</strong><p>清除你在本浏览器中的所有修改，恢复默认的 5 名虚构学员。此操作不可撤销。</p></div><button class="btn btn-danger" data-action="reset">${ico('refresh')} 恢复演示</button></div><div class="setting-row"><div><strong>存储方式</strong><p>当前为浏览器 localStorage。换电脑、换浏览器或清除浏览器数据后，数据可能丢失。</p></div><span class="pill">本地存储</span></div><div class="setting-row"><div><strong>正式商用提醒</strong><p>这个版本没有服务器登录、真实权限隔离、数据库备份和隐私合规措施，不能直接作为真实培训机构的正式系统使用。</p></div><span class="tag warn">仅供学习</span></div></div>`}
function dialog(){let content='',title='',submit='保存';const s=student(modalId);if(modal==='student'||modal==='edit'){title=modal==='edit'?'编辑学员':'新增学员';content=`<form id="studentForm"><div class="form-group"><label>学员姓名 *</label><input name="name" required maxlength="30" value="${esc(s?.name||'')}" placeholder="例如：陈同学" autofocus /></div><div class="form-grid"><div class="form-group"><label>课程类别 *</label><input name="subject" required maxlength="30" value="${esc(s?.subject||'')}" placeholder="例如：钢琴" /></div><div class="form-group"><label>负责老师 *</label><input name="teacher" required maxlength="30" value="${esc(s?.teacher||'')}" placeholder="例如：林老师" /></div></div>${modal==='student'?`<div class="form-group"><label>初始课时</label><input name="remaining" type="number" min="0" max="9999" value="10" required /></div>`:''}<div class="hint">请用虚构姓名测试，不要在此演示网站录入真实学生信息。</div><div class="dialog-actions" style="margin-top:23px"><button type="button" class="btn btn-outline" data-action="modal-close">取消</button><button type="submit" class="btn btn-primary">${submit}</button></div></form>`;}
 if(modal==='session'){title='安排新课程';content=`<form id="sessionForm"><div class="form-group"><label>选择学员 *</label><select name="studentId" required ${data.students.length?'':'disabled'}>${data.students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} · ${esc(s.subject)}（剩余 ${s.remaining} 节）</option>`).join('')}</select></div><div class="form-grid"><div class="form-group"><label>上课日期 *</label><input name="date" type="date" required value="${localISO()}" /></div><div class="form-group"><label>时间 *</label><input name="time" type="time" required value="14:00" /></div></div><div class="form-group"><label>备注（选填）</label><textarea name="note" maxlength="120" placeholder="例如：带上上次的练习作品"></textarea></div><div class="dialog-actions"><button type="button" class="btn btn-outline" data-action="modal-close">取消</button><button type="submit" class="btn btn-primary" ${data.students.length?'':'disabled'}>确认安排</button></div></form>`;}
 if(modal==='recharge'){title=`为 ${esc(s?.name||'学员')} 增加课时`;content=`<form id="rechargeForm"><div class="info-note">当前剩余：<strong>${s?.remaining??0}</strong> 节</div><div class="form-group"><label>增加课时数量 *</label><input name="amount" type="number" min="1" max="9999" required value="10" /></div><div class="form-group"><label>说明（选填）</label><input name="note" maxlength="100" placeholder="例如：新购课程包" /></div><div class="dialog-actions"><button type="button" class="btn btn-outline" data-action="modal-close">取消</button><button type="submit" class="btn btn-primary">确认增加</button></div></form>`;}
 return `<div class="overlay" data-action="modal-backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><div class="dialog-head"><h3>${title}</h3><button type="button" class="round-btn" data-action="modal-close" aria-label="关闭">${ico('x')}</button></div><div class="dialog-content">${content}</div></div></div>`}
function render(){document.getElementById('app').innerHTML=shell()}
function go(tab){view=tab;menuOpen=false;studentQuery='';window.scrollTo(0,0);render()}
function openModal(type,id=''){modal=type;modalId=id;render();setTimeout(()=>document.querySelector('.dialog input, .dialog select')?.focus(),0)}
function closeModal(){modal='';modalId='';render()}
function useLesson(id,sessionId=null){const s=student(id);if(!s){alert('找不到学员');return false}if(s.remaining<=0){alert('课时已用完，请先增加课时。');return false}if(!confirm(`确认扣除 ${s.name} 的 1 节课时吗？\n当前剩余 ${s.remaining} 节，扣除后为 ${s.remaining-1} 节。`))return false;
 s.remaining-=1;const now=new Date();if(sessionId){const c=data.sessions.find(x=>x.id===sessionId);if(!c||c.status!=='planned')return false;c.status='done';c.completedAt=localISO()}else{data.sessions.push({id:uid(),studentId:id,date:localISO(),time:`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,status:'done',completedAt:localISO(),note:'快捷消课'})}
 data.ledger.push({id:uid(),studentId:id,studentName:s.name,kind:'used',amount:1,date:localISO(),note:sessionId?'完成预约课程':'快捷消课'});save();render();return true}
function exportData(){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`课时管家备份-${localISO()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action,id=target.dataset.id;if(action==='nav')return go(target.dataset.view);if(action==='menu-open'){menuOpen=true;return render()}if(action==='menu-close'){menuOpen=false;return render()}if(action==='modal')return openModal(target.dataset.modal,id);if(action==='modal-close')return closeModal();if(action==='modal-backdrop'&&e.target===target)return closeModal();if(action==='use')return useLesson(id);if(action==='complete'){const c=data.sessions.find(c=>c.id===id);if(c&&c.status==='planned')return useLesson(c.studentId,id)}if(action==='cancel'){const c=data.sessions.find(c=>c.id===id);if(c&&c.status==='planned'&&confirm('确定取消这次预约吗？取消不会扣除课时。')){c.status='cancelled';save();render()}return}if(action==='session-filter'){sessionFilter=target.dataset.filter;return render()}if(action==='export')return exportData();if(action==='reset'&&confirm('确定恢复初始演示数据吗？当前添加的学员、课程和流水将被清除！')){data=seed();save();return go('dashboard')}});
document.addEventListener('input',e=>{if(e.target.id==='studentSearch'){studentQuery=e.target.value;const pos=e.target.selectionStart;render();const field=document.getElementById('studentSearch');field?.focus();field?.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='subjectFilter'){subjectFilter=e.target.value;render()}});
document.addEventListener('submit',e=>{if(!['studentForm','sessionForm','rechargeForm'].includes(e.target.id))return;e.preventDefault();const form=e.target,fd=new FormData(form);if(form.id==='studentForm'){const name=String(fd.get('name')||'').trim(),subject=String(fd.get('subject')||'').trim(),teacher=String(fd.get('teacher')||'').trim();if(!name||!subject||!teacher)return alert('请填写必填信息');if(modal==='edit'){const s=student(modalId);if(!s)return;s.name=name;s.subject=subject;s.teacher=teacher}else{const remaining=Number(fd.get('remaining'));if(!Number.isInteger(remaining)||remaining<0||remaining>9999)return alert('请输入 0–9999 的课时');data.students.push({id:uid(),name,subject,teacher,remaining,total:remaining,phone:'',joined:localISO(),color:data.students.length%5})}save();modal='';return go('students')}
 if(form.id==='sessionForm'){const studentId=String(fd.get('studentId')),date=String(fd.get('date')),time=String(fd.get('time')),note=String(fd.get('note')||'').trim();if(!student(studentId)||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{2}:\d{2}$/.test(time))return alert('请填写有效的课程信息');data.sessions.push({id:uid(),studentId,date,time,note,status:'planned'});save();modal='';sessionFilter='planned';return go('schedule')}
 if(form.id==='rechargeForm'){const s=student(modalId);if(!s)return;const amount=Number(fd.get('amount')),note=String(fd.get('note')||'').trim();if(!Number.isInteger(amount)||amount<1||amount>9999)return alert('请输入 1–9999 的课时数量');s.remaining+=amount;s.total+=amount;data.ledger.push({id:uid(),studentId:s.id,studentName:s.name,kind:'recharge',amount,date:localISO(),note:note||'增加课时'});save();modal='';return go('students')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
render();
</script>
</body>
</html>
